<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rewards Search Automator</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/fa-all.min.css" rel="stylesheet">
    <link href="./css/custom.css" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <div class="app-header text-center">
        <div class="header-icon">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <h1 class="app-title">Rewards Automator</h1>
        <p class="app-subtitle">Automated Bing searches for Microsoft Rewards</p>
    </div>

    <div class="container-fluid px-3">
        <!-- Stats -->
        <div class="row g-2 mb-3">
            <div class="col-4">
                <div class="stat-tile">
                    <span class="stat-value" id="statsToday">0</span>
                    <span class="stat-label">today</span>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-tile">
                    <span class="stat-value" id="statsStreak">0</span>
                    <span class="stat-label">day streak</span>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-tile">
                    <span class="stat-value" id="statsTotal">0</span>
                    <span class="stat-label">all time</span>
                </div>
            </div>
        </div>

        <!-- Presets -->
        <div class="row g-2 mb-2">
            <div class="col-4">
                <button type="button" class="btn btn-preset w-100" id="presetQuick">Quick</button>
            </div>
            <div class="col-4">
                <button type="button" class="btn btn-preset w-100" id="presetDaily">Daily</button>
            </div>
            <div class="col-4">
                <button type="button" class="btn btn-preset w-100" id="presetHeavy">Heavy</button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="row g-2 mb-2">
            <div class="col-4">
                <button type="button" class="btn btn-action btn-desktop w-100" id="desktopButton">
                    <i class="fa-solid fa-desktop"></i>
                    <span>Desktop</span>
                </button>
            </div>
            <div class="col-4">
                <button type="button" class="btn btn-action btn-mobile w-100" id="mobileButton">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>Mobile</span>
                </button>
            </div>
            <div class="col-4">
                <button type="button" class="btn btn-action btn-both w-100" id="desktopMobileButton">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Both</span>
                </button>
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-12">
                <button type="button" class="btn btn-stop w-100" id="stopButton" style="display: none;">
                    <i class="fa-solid fa-stop"></i>
                    <span>Stop run</span>
                </button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="row mb-1">
            <div class="col-12">
                <div class="progress">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                        aria-valuemin="0" aria-valuemax="100" style="width: 0%">
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-12">
                <small class="d-block text-center progress-label" id="progressLabel"></small>
                <small class="d-block text-center eta-label" id="etaLabel"></small>
                <small class="d-block text-center countdown-label" id="countdownLabel"></small>
                <small class="d-block text-center keyword-pool-label" id="keywordPoolLabel"></small>
            </div>
        </div>

        <!-- Emulation Diagnostics -->
        <div class="alert alert-info alert-dismissible fade" id="diagnosticsPanel" style="display: none;">
            <strong>Emulation check</strong>
            <div id="diagnosticsBody" class="mt-1 diagnostics-body"></div>
        </div>

        <div class="row g-2 mb-2">
            <div class="col-12">
                <button type="button" class="btn btn-check w-100" id="checkEmulationButton">
                    <i class="fa-solid fa-stethoscope"></i>
                    <span>Check emulation</span>
                </button>
            </div>
        </div>

        <!-- Error / Success Notification -->
        <div class="alert alert-danger alert-dismissible fade" id="errorNotification" style="display: none; margin-bottom: 10px;">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="errorText"></span>
        </div>
        <div class="alert alert-success alert-dismissible fade" id="saveNotification" style="display: none; margin-bottom: 10px;">
            <i class="fa-solid fa-check-circle"></i>
            <span id="saveText">Configuration saved.</span>
        </div>

        <!-- Settings -->
        <div class="row g-2 mb-2">
            <div class="col-6">
                <label class="form-label">
                    <i class="fa-solid fa-desktop"></i> Desktop
                </label>
                <input type="number" class="form-control form-control-sm" id="totDesktopSearchesForm" min="1" value="">
            </div>
            <div class="col-6">
                <label class="form-label">
                    <i class="fa-solid fa-mobile-screen"></i> Mobile
                </label>
                <input type="number" class="form-control form-control-sm" id="totMobileSearchesForm" min="1" value="">
            </div>
        </div>

        <div class="row g-2 mb-1">
            <div class="col-6">
                <label class="form-label">
                    <i class="fa-solid fa-hourglass-start"></i> Min (ms)
                </label>
                <input type="number" class="form-control form-control-sm"
                    id="waitingBetweenSearchesFormMin" min="100" value="">
            </div>
            <div class="col-6">
                <label class="form-label">
                    <i class="fa-solid fa-hourglass-end"></i> Max (ms)
                </label>
                <input type="number" class="form-control form-control-sm"
                    id="waitingBetweenSearchesFormMax" min="100" value="">
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-12">
                <button type="button" class="btn btn-save-config w-100" id="saveConfigButton">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Save Configuration</span>
                </button>
            </div>
        </div>

        <!-- Run log -->
        <div class="row g-2 mb-2">
            <div class="col-12">
                <div class="runlog-head">
                    <span>Recent searches</span>
                    <button type="button" class="runlog-clear" id="clearStatsButton">clear</button>
                </div>
                <small class="last-run-label" id="lastRunLabel"></small>
                <div class="runlog" id="runLog"></div>
            </div>
        </div>

        <!-- F1 Promo Banner -->
        <div class="row">
            <div class="col-12">
                <a href="" target="_blank" class="btn-f1-promo" id="btn-f1-promo">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <span>Formula 1 Fan?</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <nav class="navbar navbar-expand fixed-bottom app-footer">
        <div class="container-fluid">
            <span class="footer-version" id="appVersion"></span>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link footer-link" href="" target="_blank"
                        title="Author's Website" id="authorWebsiteLink">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link footer-link" href=""
                        target="_blank" title="Source Code" id="repositoryGithubLink">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link footer-link" href=""
                        target="_blank" title="Chrome Store" id="storeLink">
                        <i class="fa-brands fa-chrome"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link footer-link" href=""
                        target="_blank" title="Microsoft Rewards" id="rewardsLink">
                        <i class="fa-solid fa-medal"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <script src="./js/jquery-3.6.0.min.js"></script>
    <script src="./js/fa-all.min.js"></script>
    <script type="module" src="./js/popup.js"></script>
</body>

</html>
